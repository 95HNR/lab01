<!DOCTYPE html>
<html lang="hu">

    <meta charset="UTF-8">

    <header>
        <nav>

            </ul>
        </nav>
    </header>

    <main>
        <h1>Kapcsolatfelvétel</h1>
        <form action="#" method="POST">
            <div>
                <label for="nev">Név:</label><br>
                <input type="text" id="nev" name="nev" required>
            </div>
            <div>
                <label for="email">E-mail cím:</label><br>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="uzenet">Üzenet:</label><br>
                <textarea id="uzenet" name="uzenet" rows="4" required></textarea>
            </div>
            <div>
                <button type="submit">Küldés</button>
            </div>
        </form>

        <!-- Oldalsáv -->
        <aside>
            <h3>Gyorslinkek</h3>
            <ul>
                <li><a href="index.html">Főoldal</a></li>
                <li><a href="rolam.html">Rólam oldal</a></li>
                <li><a href="projektek.html">Projektek oldal</a></li>
            </ul>
        </aside>

        <p><a href="index.html">&larr; Vissza a főoldalra</a></p>
    </main>
